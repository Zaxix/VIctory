name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Three newer lints fire in victory-shader's test files (wave64_after_loop.rs,
      # valu_tests.rs). They are allowed here rather than fixed in place: every file
      # under victory-shader/src feeds the shader cache key, so any edit there makes
      # the owner's whole shader cache translate again. (The float compares in valu_tests.rs
      # are meant: `a < b || a > b` is not `a != b` for NaN.)
      - name: Clippy
        run: cargo clippy --keep-going --workspace --all-targets --locked -- -D warnings -A clippy::precedence -A clippy::nonminimal_bool -A clippy::neg_cmp_op_on_partial_ord -A clippy::double_comparisons
      - name: Clippy, diagnostics build
        run: cargo clippy --keep-going --workspace --all-targets --all-features --locked -- -D warnings -A clippy::precedence -A clippy::nonminimal_bool -A clippy::neg_cmp_op_on_partial_ord -A clippy::double_comparisons
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked --exclude victory-gpu
      # The runner has no card, so these tests make their devices on Microsoft's software
      # renderer, whose shader compiler has crashed the test program (access violation in
      # d3d10warp) when several tests used it at once. One test at a time has not shown it.
      - name: Tests, victory-gpu (one at a time)
        run: cargo test -p victory-gpu --locked -- --test-threads=1
